name: Android APK

on:
  push:
    branches: [main, "design/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKE_VIDEO: ${{ contains(github.event.head_commit.message, '[video]') && '1' || '0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric si stahuje obraz Androidu z Maven Central; v mezipaměti, aby nás nebrzdil limit 429
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1-sdk34

      - name: Unit testy
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Sestavení APK (release, bez ladicího režimu)
        run: ./gradlew assembleRelease --stacktrace

      - name: Pojmenovat APK
        run: |
          mkdir -p out
          V=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "out/DochazkaKutil-v${V}-${{ github.run_number }}.apk"
          ls -la out

      - name: Podpis novým klíčem (rotace z veřejného klíče)
        # Starý klíč v keystore/ je veřejný (repozitář je veřejný). Pokud je v GitHub Secrets nový
        # soukromý klíč, APK se podepíše oběma s rotací podpisu (APK Signature Scheme v3): telefon
        # s dosavadní verzí přijme aktualizaci a od té chvíle věří jen novému klíči.
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::warning::Nový podpisový klíč není v GitHub Secrets – APK zůstává podepsané starým (veřejným) klíčem."
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APK=$(ls out/*.apk)
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks keystore/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --new-signer --ks "$RUNNER_TEMP/release.jks" --ks-pass env:RELEASE_KEY_PASSWORD --ks-key-alias dochazka --key-pass env:RELEASE_KEY_PASSWORD
          "$BT/apksigner" sign \
            --ks keystore/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --next-signer --ks "$RUNNER_TEMP/release.jks" --ks-pass env:RELEASE_KEY_PASSWORD --ks-key-alias dochazka --key-pass env:RELEASE_KEY_PASSWORD \
            --lineage "$RUNNER_TEMP/lineage.bin" \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          rm -f "$APK.signed.idsig" "$APK.idsig"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer|certificate SHA-256" || true
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Výsledky testů
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Snímky obrazovek (vizuální kontrola)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore

      - name: Ukázkové video (jen když commit obsahuje [video])
        if: always() && github.ref != 'refs/heads/main'
        run: |
          if ls app/build/video/f*.jpg >/dev/null 2>&1; then
            sudo apt-get install -y -qq ffmpeg >/dev/null
            ffmpeg -loglevel error -framerate 24 -i app/build/video/f%05d.jpg -c:v libx264 -preset veryfast -crf 27 -pix_fmt yuv420p /tmp/demo.mp4
            ls -la /tmp/demo.mp4
            echo "VIDEO_BEGIN"
            base64 -w 200 /tmp/demo.mp4
            echo "VIDEO_END"
          fi

      - name: Snímky obrazovek do záznamu (pro kontrolu vzhledu)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          cd app/build/screenshots 2>/dev/null || exit 0
          for f in *.jpg; do
            echo "SHOT_BEGIN ${f%.jpg}"
            base64 -w 200 "$f"
            echo "SHOT_END"
          done

      - name: Artefakt APK
        uses: actions/upload-artifact@v4
        with:
          name: DochazkaKutil-apk
          path: out/*.apk

      - name: Vydání (Release) s APK ke stažení
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "Docházka Kutil – verze ${APP_VERSION} (sestavení ${{ github.run_number }})" \
            --notes "Automatické sestavení z commitu ${{ github.sha }}. Stáhni soubor .apk níže a nainstaluj ho v telefonu." \
            --latest

      - name: Testovací verze z vývojové větve (předběžné vydání)
        # Z vývojové větve vzniká jen „Pre-release“: kontrola aktualizací v aplikaci ho nenabízí
        # a hlavní vydání (Latest) zůstává beze změny.
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" out/*.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "TESTOVACÍ verze ${APP_VERSION} – ${{ github.ref_name }} (sestavení ${{ github.run_number }})" \
            --notes "Testovací sestavení z větve ${{ github.ref_name }} (commit ${{ github.sha }}). Není v hlavní větvi main."
